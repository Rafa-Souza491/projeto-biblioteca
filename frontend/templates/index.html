<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sistema de Biblioteca</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 40px;
            background-color: #f5f5f5;
            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            margin-bottom: 40px;
        }

        .menu {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
        }

        .card {
            width: 250px;
            padding: 30px;
            background-color: white;
            border: 1px solid #ccc;
            border-radius: 10px;
            text-decoration: none;
            color: black;
            box-sizing: border-box;
        }

        .card:hover {
            background-color: #eeeeee;
        }

        .icone {
            font-size: 45px;
            margin-bottom: 15px;
        }

        .titulo {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .descricao {
            font-size: 14px;
        }
    </style>
</head>

<body>

    <h1>Sistema de Biblioteca</h1>

    <p>Selecione uma das opções abaixo:</p>

    <div class="menu">

        <a href="/livros" class="card">

            <div class="icone">📚</div>

            <div class="titulo">
                Livros
            </div>

            <div class="descricao">
                Cadastrar, editar, listar e excluir livros.
            </div>

        </a>

        <a href="/usuarios" class="card">

            <div class="icone">👤</div>

            <div class="titulo">
                Usuários
            </div>

            <div class="descricao">
                Cadastrar, editar, listar e excluir usuários.
            </div>

        </a>

        <a href="/emprestimos" class="card">

            <div class="icone">📖</div>

            <div class="titulo">
                Empréstimos
            </div>

            <div class="descricao">
                Gerenciar empréstimos de livros.
            </div>

        </a>

    </div>

</body>

</html>
