<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Editar Livro</title>

</head>

<body>

    <h1>Editar Livro</h1>

    <form action="/livros/{{ livro.id }}/editar" method="POST">

        <label for="titulo">Título:</label>

        <input
            type="text"
            id="titulo"
            name="titulo"
            value="{{ livro.titulo }}"
            required
        >

        <br><br>


        <label for="autor">Autor:</label>

        <input
            type="text"
            id="autor"
            name="autor"
            value="{{ livro.autor }}"
            required
        >

        <br><br>


        <label for="isbn">ISBN:</label>

        <input
            type="text"
            id="isbn"
            name="isbn"
            value="{{ livro.isbn or '' }}"
        >

        <br><br>


        <label for="categoria">Categoria:</label>

        <input
            type="text"
            id="categoria"
            name="categoria"
            value="{{ livro.categoria or '' }}"
        >

        <br><br>


        <label for="ano_publicacao">Ano de publicação:</label>

        <input
            type="number"
            id="ano_publicacao"
            name="ano_publicacao"
            value="{{ livro.ano_publicacao or '' }}"
        >

        <br><br>


        <label for="quantidade">Quantidade:</label>

        <input
            type="number"
            id="quantidade"
            name="quantidade"
            value="{{ livro.quantidade }}"
            required
        >

        <br><br>

        <button type="submit">
            Salvar alterações
        </button>

    </form>

    <br>

    <a href="/">Voltar para livros</a>

</body>

</html>
